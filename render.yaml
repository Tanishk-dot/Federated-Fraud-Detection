# Render Blueprint - deploys backend/main.py as a persistent Python web
# service. Vercel can't host this: it needs torch (too large for Vercel's
# serverless function size cap) and keeps real-time job state (Train,
# Live Simulation) in an in-memory dict across requests, which breaks
# under Vercel's stateless serverless model. See backend/requirements.txt
# for why this is a lean, backend-only dependency set, not the repo
# root's full research/training requirements.txt.
services:
  - type: web
    name: fraud-detection-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false  # set to the deployed Vercel domain(s), comma-separated
